buildscript {
    ext.kotlin_version = '1.3.72'
    repositories {
        google()
        mavenCentral()      // ← 原来 jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()      // ← 原来 jcenter()
    }
}